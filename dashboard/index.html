<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot" aria-hidden="true"></span><div><h1>Launch Radar</h1><p id="sub">Protocols that record no token, ranked by what their launch would be worth</p></div></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="board">Board</button>
    <button role="tab" data-view="trading">Already trading</button>
    <button role="tab" data-view="aside">Set aside</button>
    <button role="tab" data-view="model">Model</button>
  </nav>
</header>
<section class="kpis" id="kpis" aria-label="Summary"></section>
<main id="main" tabindex="-1"></main>
<aside id="detail" class="detail" aria-label="Protocol detail" hidden></aside>
<noscript>This radar draws itself from data.js with JavaScript; turn it on to see the board.</noscript>
<script src="../data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
